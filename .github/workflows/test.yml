name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python tools/check_repository.py
      - run: python -m pytest -q
      - name: Build and verify wheel
        run: |
          python -m pip wheel --no-deps . -w /tmp/wheels
          python -m pip install --no-deps --target /tmp/installed /tmp/wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/installed FPL_PREDICT_HOME=/tmp/runtime python -m fpl_predict_cli init
