name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python tools/check_repository.py
      - run: python -m pytest -q
      - name: Build and verify wheel
        run: |
          python -m pip wheel --no-deps . -w /tmp/wheels
          python -m pip install --no-deps --target /tmp/installed /tmp/wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/installed FPL_PREDICT_HOME=/tmp/runtime python -m fpl_predict_cli init
