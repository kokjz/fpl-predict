name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python tools/check_repository.py
      - run: python -m pytest -q
      - name: Build and verify wheel
        run: |
          python -m pip wheel --no-deps . -w /tmp/wheels
          python -m pip install --no-deps --target /tmp/installed /tmp/wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/installed FPL_PREDICT_HOME=/tmp/runtime python -m fpl_predict_cli init
